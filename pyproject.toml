[project]
name = "mesa-ec2026-av-challenge"
version = "0.1.0"
description = "Polimi/MESA EC2026 autonomous vehicle challenge pipeline for detection, fusion, tracking, mapping, prediction, behaviour prediction, and overtake planning."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "filterpy>=1.4.5",
    "h5py>=3.16.0",
    "ipykernel>=7.2.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.10.9",
    "networkx>=3.6.1",
    "numpy>=2.4.6",
    "open3d>=0.19.0",
    "opencv-python>=4.13.0.92",
    "pandas>=3.0.3",
    "pyyaml>=6.0.3",
    "rosbags>=0.11.2",
    "rosbags-image>=0.10.3",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.1",
    "shapely>=2.1.2",
    "tqdm>=4.67.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
